name: Sync Upstream

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge upstream main
        run: |
          git config user.name "3anLouYouGu1"
          git config user.email "1395220189@qq.com"
          git remote add upstream https://github.com/zhuweiyou/oc2api.git
          git fetch upstream main
          git merge upstream/main --no-edit -X theirs
          git push origin main
